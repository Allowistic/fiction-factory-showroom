<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Land Yacht Bay 04</title>
    <style>
      html, body {
        margin: 0; padding: 0; overflow: hidden; background: #2a2434;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; touch-action: none; }
      #back-to-showroom {
        position: fixed; left: 14px; top: calc(12px + env(safe-area-inset-top)); z-index: 5;
        color: #fff; font: 600 12px/1 ui-monospace, monospace; text-decoration: none;
        background: rgba(18, 12, 24, 0.62); border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px; padding: 7px 12px; touch-action: manipulation;
      }
      #hint {
        position: fixed; left: 14px; top: calc(48px + env(safe-area-inset-top)); z-index: 3;
        color: #f3e4ee; font: 12px/1.45 ui-monospace, monospace; text-shadow: 0 1px 2px #2a1d38;
        max-width: min(30rem, calc(100vw - 190px)); pointer-events: none; opacity: 0.92;
      }
      #music {
        position: fixed; right: 14px; top: calc(12px + env(safe-area-inset-top)); z-index: 4;
        font: 600 13px ui-monospace, monospace; color: #fff3f8;
        background: rgba(60, 38, 84, 0.72); border: 1px solid rgba(255, 210, 230, 0.55);
        border-radius: 999px; padding: 9px 14px; cursor: pointer; touch-action: manipulation;
      }
      #music.on { background: rgba(214, 103, 143, 0.82); }
      #VRButton {
        top: calc(54px + env(safe-area-inset-top)) !important; bottom: auto !important;
        left: auto !important; right: 14px !important; z-index: 4 !important;
      }
      #touch-controls { display: none; }
      #touch-controls.visible { display: block; }
      .stick {
        position: fixed; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 3;
        width: 132px; height: 132px; border-radius: 50%; touch-action: none;
        background: radial-gradient(circle, rgba(255, 220, 235, 0.10), rgba(255, 220, 235, 0.22));
        border: 2px solid rgba(255, 220, 235, 0.45); box-sizing: border-box;
      }
      .stick-left { left: calc(22px + env(safe-area-inset-left)); }
      .stick-right { right: calc(22px + env(safe-area-inset-right)); }
      .stick.active { border-color: rgba(255, 235, 245, 0.85); }
      .knob {
        position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
        border-radius: 50%; background: rgba(255, 228, 240, 0.72); box-shadow: 0 2px 8px rgba(40, 20, 60, 0.45);
        pointer-events: none;
      }
      .stick-label {
        position: absolute; left: 0; right: 0; bottom: -18px; text-align: center; pointer-events: none;
        font: 10px ui-monospace, monospace; letter-spacing: 0.12em; color: rgba(255, 228, 240, 0.8);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BFPQzPAc.js"></script>
  </head>
  <body>
    <a id="back-to-showroom" href="../showroom/">Back to Owl Cove</a>
    <div id="hint">Loading land yacht…</div>
    <button id="music" type="button" aria-pressed="false">♪ Tap for music</button>
  </body>
</html>
